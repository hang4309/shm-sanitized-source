<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">SHM sensor data pipeline architecture</title>
  <desc id="desc">An architecture diagram, not a dashboard screenshot. OS265-format sensor files enter a Python incremental collector, then a Java API and MySQL data layer, and finally Vue monitoring views.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#56d6ba"/></marker>
  </defs>
  <rect width="1280" height="410" rx="20" fill="#111c2b"/>
  <text x="48" y="57" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#56d6ba">SHM / DATA FLOW</text>
  <text x="48" y="104" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#f2f6fb">Collect. Trace. Query. Visualize.</text>
  <text x="48" y="134" font-family="Arial,sans-serif" font-size="16" fill="#b0bfd1">One reading model, from a growing text file to a monitoring view.</text>
  <g fill="#1b2b40" stroke="#344961">
    <rect x="48" y="180" width="248" height="140" rx="12"/>
    <rect x="360" y="180" width="248" height="140" rx="12"/>
    <rect x="672" y="180" width="248" height="140" rx="12"/>
    <rect x="984" y="180" width="248" height="140" rx="12"/>
  </g>
  <g stroke="#56d6ba" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M308 250 H346"/><path d="M620 250 H658"/><path d="M932 250 H970"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g font-size="13" font-weight="700" letter-spacing="1.2" fill="#56d6ba">
      <text x="70" y="211">01 / INPUT</text><text x="382" y="211">02 / COLLECT</text><text x="694" y="211">03 / STORE &amp; QUERY</text><text x="1006" y="211">04 / EXPLORE</text>
    </g>
    <g font-size="23" font-weight="700" fill="#f2f6fb">
      <text x="70" y="248">Sensor files</text><text x="382" y="248">Python collector</text><text x="694" y="248">Java + MySQL</text><text x="1006" y="248">Vue dashboard</text>
    </g>
    <g font-size="15" fill="#b0bfd1">
      <text x="70" y="279">OS265-format text</text><text x="70" y="300">Values + timestamps</text>
      <text x="382" y="279">Incremental reads</text><text x="382" y="300">Checkpoints + retries</text>
      <text x="694" y="279">Source identity + mapping</text><text x="694" y="300">Latest / history APIs</text>
      <text x="1006" y="279">Live / time-window views</text><text x="1006" y="300">Trends + reading tables</text>
    </g>
    <line x1="48" y1="351" x2="1232" y2="351" stroke="#344961"/>
    <text x="48" y="382" font-size="14" fill="#b0bfd1">Traceability: source file · line · offset · sensor · collection time</text>
    <text x="1232" y="382" text-anchor="end" font-size="14" fill="#56d6ba">ARCHITECTURE OVERVIEW</text>
  </g>
</svg>
